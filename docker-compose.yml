# Local development only. Not tested.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: eventhub, POSTGRES_PASSWORD: eventhub, POSTGRES_DB: eventhub }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  testdb:
    image: postgres:16
    environment: { POSTGRES_USER: eventhub, POSTGRES_PASSWORD: eventhub, POSTGRES_DB: eventhub_test }
    ports: ["5433:5432"]
volumes: { dbdata: {} }
